<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Download Agent S for macOS</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1f2026;
      --muted: #6b6f76;
      --bg: #f7f7f5;
      --accent: #312e81;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2f3f5;
        --muted: #a7adb8;
        --bg: #0e0f12;
        --accent: #a5b4fc;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 32rem;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 1rem;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0.5rem 0;
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Download Agent S</h1>
    <p id="status">Finding the latest macOS build…</p>
    <p><a id="manual" href="https://github.com/simular-ai/Agent-S/releases/latest">Download from GitHub</a></p>
  </main>
  <script>
    (() => {
      const fallback = 'https://github.com/simular-ai/Agent-S/releases/latest';
      const status = document.getElementById('status');
      const manual = document.getElementById('manual');
      const api = 'https://api.github.com/repos/simular-ai/Agent-S/releases/latest';
      const assetPattern = /^Agent-S-macOS-\d+\.\d+\.\d+-arm64\.dmg$/;

      const open = (url) => {
        status.textContent = 'Opening the latest build…';
        manual.href = url;
        window.location.replace(url);
      };

      fetch(api, { headers: { Accept: 'application/vnd.github+json' } })
        .then((response) => {
          if (!response.ok) throw new Error(`GitHub API ${response.status}`);
          return response.json();
        })
        .then((release) => {
          const asset = (release.assets || []).find((item) => assetPattern.test(item.name));
          if (!asset) throw new Error('No macOS DMG in the latest release');
          open(asset.browser_download_url);
        })
        .catch(() => {
          status.textContent = 'Could not find the latest build automatically.';
          manual.href = fallback;
        });
    })();
  </script>
</body>
</html>
